# yaml-language-server: $schema=https://githubusercontent.com
name: " Theme Designer Workspace"
version: "1.0.0"
schema: "v1"

models:
  - name: "Qwen3 - coder 30b a3b"
  provider: "llama.cpp"
  model: "qwen3-coder-30b-a3b"
  apiBase: "http://192.168.1.167:8080/v1"
  contextLength: 8192
  maxTokens: 4096
  completionOptions:
    temperature: 0.2
  roles:
    - chat
    - edit

  - name: "Qwen3.5 9b"
    provider: "llama.cpp"
    model: "Qwen3.5-9B-Q4_K_M.gguf"
    apiBase: "http://192.168.1.167:8080/v1"
    contextLength: 8192 # Enforced 8k window bounds to protect your VRAM tax
    maxTokens: 4096
    completionOptions:
      temperature: 0.2
    roles:
      - chat
      - edit
      - apply
      - autocomplete

  - name: "Qwen3 14b (Remote chat/code)"
    provider: "llama.cpp"
    model: "Qwen3-14B-Q4_K_M.gguf"
    apiBase: "http://192.168.1.167:8080/v1"
    contextLength: 16384
    maxTokens: 2048
    roles:
      - chat
      - edit
      - apply
      - autocomplete
    requestOptions:
      extraBody:
        reasoning_budget: 0

mcpServers:
  workspace-filesystem:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "%workspace%/theme-designer" # <---- Lock this bitch DOWN. Also TODO research how to sandbox so I don't risk destroying my computer
  primeng:
    command: "node"
    args:
      - "-e"
      - "require('@primeng/mcp/server')"
