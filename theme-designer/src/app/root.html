<p-toolbar styleClass="td-root-toolbar">
  <ng-template #start>
    <span class="td-root-title">{{ title() }}</span>
  </ng-template>
  <!-- The top toolbar - this button should be a light/dark theme toggle, ONLY if they choose to add a dark theme in step 2-->
  <ng-template #end>
    <button
      pButton
      type="button"
      class="p-button-text"
      icon="pi pi-cog"
      label="Settings"
    ></button>
  </ng-template>
</p-toolbar>

<div class="td-root-container">
  <router-outlet></router-outlet>
</div>
