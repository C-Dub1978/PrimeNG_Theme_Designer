<p-toolbar styleClass="td-root-toolbar">
  <ng-template #start>
    <span class="td-root-title">{{ title() }}</span>
  </ng-template>
  <!-- The top toolbar - this button should be a light/dark theme toggle, ONLY if they choose to add a dark theme in step 2-->
  <ng-template #end>
    @if (!!schemaHasDarkMode()) {
      <div class="switch-wrapper">
        <span class="switch-label">{{ !!darkModeActive ? '🌚' : '🌞' }}</span>
        <p-toggleswitch [disabled]="!schemaHasDarkMode()" (click)="toggleDarkMode()">
        </p-toggleswitch>
      </div>
    }
  </ng-template>
</p-toolbar>

<div class="td-root-container">
  <router-outlet></router-outlet>
</div>
